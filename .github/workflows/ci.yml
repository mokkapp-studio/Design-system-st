name: Contratos

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Archivos generados al día
        run: npm run check:generated
      - name: El código cumple los contratos
        run: npm run validate
      - name: Specs ejecutables (tests)
        run: npm test
      - name: La app compila
        run: npx next build
